name: Update APT Repository

on:
  repository_dispatch:
    types: [update-sql-pipe, update-ghoten, update-damas]
  workflow_dispatch:
    inputs:
      package:
        description: "Package whose release triggered the rebuild"
        required: true
        default: sql-pipe
        type: choice
        options:
          - sql-pipe
          - ghoten
          - damas
      version:
        description: "Release version without v; leave empty to use latest stable"
        required: false

# Publisher contract (docs/receivers.md in vmvarela/package-distribution).
env:
  PACKAGE_DISTRIBUTION_SHA: ec0ce2ffdc3406f92b773da9bfade186640d6a57

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy APT repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out package-distribution
        uses: actions/checkout@v7
        with:
          repository: vmvarela/package-distribution
          ref: ${{ env.PACKAGE_DISTRIBUTION_SHA }}
          path: package-distribution
          persist-credentials: false

      - name: Resolve target and version
        id: vars
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "${EVENT_ACTION:-${INPUT_PACKAGE:-}}" in
            update-sql-pipe|sql-pipe) target="sql-pipe" ;;
            update-ghoten|ghoten) target="ghoten" ;;
            update-damas|damas) target="damas" ;;
            *) echo "::error::Unknown package update event."; exit 1 ;;
          esac

          catalog="package-distribution/catalog/${target}.json"
          repo="$(jq -r '.repo' "$catalog")"
          version="${REQUESTED_VERSION:-}"
          version="${version#v}"
          if [[ -z "$version" ]]; then
            version="$(gh api "repos/${repo}/releases/latest" --jq .tag_name)"
            version="${version#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a stable release version for ${target}: ${version}"
            exit 1
          fi

          {
            echo "target=${target}"
            echo "catalog=${catalog}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Import signing key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -z "${GPG_SIGNING_KEY}" ] || [ -z "${GPG_KEY_ID}" ]; then
            echo "::error::GPG_SIGNING_KEY and GPG_KEY_ID secrets must be configured; refusing to deploy an unsigned repository."
            exit 1
          fi
          echo "${GPG_SIGNING_KEY}" | gpg --batch --import

      - name: Publish site
        id: publish
        shell: bash
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          TARGET: ${{ steps.vars.outputs.target }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          node package-distribution/scripts/apt-publish.mjs \
            --catalog "package-distribution/catalog/${TARGET}.json" \
            --version "${VERSION}" \
            --source github \
            --out site \
            --state state \
            --release-date "$(date -u +%F)"
          if [ -f site/.complete ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change for ${TARGET} ${VERSION}; nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create index page
        if: steps.publish.outputs.deploy == 'true'
        run: |
          cat > site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>vmvarela APT repository</title></head>
          <body>
          <h1>vmvarela APT repository</h1>
          <h2>Installation</h2>
          <pre>
          curl -sSL https://vmvarela.github.io/apt-packages/key.gpg \
            | sudo tee /etc/apt/keyrings/vmvarela.asc
          echo "deb [signed-by=/etc/apt/keyrings/vmvarela.asc] https://vmvarela.github.io/apt-packages stable main" \
            | sudo tee /etc/apt/sources.list.d/vmvarela.list
          sudo apt update
          sudo apt install sql-pipe
          sudo apt install ghoten
          sudo apt install damas
          </pre>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        if: steps.publish.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        if: steps.publish.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record durable state
        if: steps.publish.outputs.deploy == 'true'
        shell: bash
        env:
          TARGET: ${{ steps.vars.outputs.target }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          rsync -a --delete site.state/ state/
          git add state
          if git diff --cached --quiet; then
            echo "State already current."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(state): record ${TARGET} ${VERSION}"
          git push origin HEAD:main
