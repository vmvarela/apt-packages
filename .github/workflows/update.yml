name: Update APT Repository

on:
  repository_dispatch:
    types: [update-sql-pipe, update-ghoten]
  workflow_dispatch:
    inputs:
      package:
        description: "Package whose release triggered the rebuild"
        required: true
        default: sql-pipe
        type: choice
        options:
          - sql-pipe
          - ghoten
      version:
        description: "Release version without v; leave empty to use latest stable"
        required: false

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy APT repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apt-utils gnupg

      - name: Resolve package versions
        id: vars
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          set -euo pipefail

          latest_version() {
            curl --fail --silent --show-error \
              "https://api.github.com/repos/vmvarela/$1/releases/latest" |
              jq -r '.tag_name' |
              sed 's/^v//'
          }

          case "${EVENT_ACTION:-${INPUT_PACKAGE:-}}" in
            update-sql-pipe|sql-pipe) target="sql-pipe" ;;
            update-ghoten|ghoten) target="ghoten" ;;
            *) echo "::error::Unknown package update event."; exit 1 ;;
          esac

          sql_pipe_version="$(latest_version sql-pipe)"
          ghoten_version="$(latest_version ghoten)"

          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            requested="${REQUESTED_VERSION#v}"
            if [[ "$target" == "sql-pipe" ]]; then
              sql_pipe_version="$requested"
            else
              ghoten_version="$requested"
            fi
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "sql_pipe_version=$sql_pipe_version" >> "$GITHUB_OUTPUT"
          echo "ghoten_version=$ghoten_version" >> "$GITHUB_OUTPUT"
          echo "Rebuilding APT repository: sql-pipe=$sql_pipe_version, ghoten=$ghoten_version"

      - name: Download .deb packages
        shell: bash
        env:
          TARGET: ${{ steps.vars.outputs.target }}
          SQL_PIPE_VERSION: ${{ steps.vars.outputs.sql_pipe_version }}
          GHOTEN_VERSION: ${{ steps.vars.outputs.ghoten_version }}
        run: |
          set -euo pipefail
          mkdir -p site/pool/main/s/sql-pipe site/pool/main/g/ghoten

          for arch in amd64 arm64 armhf i386; do
            file="sql-pipe_${SQL_PIPE_VERSION}_${arch}.deb"
            curl --fail --silent --show-error --location \
              "https://github.com/vmvarela/sql-pipe/releases/download/v${SQL_PIPE_VERSION}/${file}" \
              -o "site/pool/main/s/sql-pipe/${file}"
          done

          ghoten_count=0
          for arch in amd64 arm64; do
            file="ghoten_${GHOTEN_VERSION}_${arch}.deb"
            if curl --fail --silent --show-error --location \
              "https://github.com/vmvarela/ghoten/releases/download/v${GHOTEN_VERSION}/${file}" \
              -o "site/pool/main/g/ghoten/${file}"; then
              ghoten_count=$((ghoten_count + 1))
            else
              rm -f "site/pool/main/g/ghoten/${file}"
              echo "Ghoten native package not available yet: ${file}"
            fi
          done

          if [[ "$TARGET" == "ghoten" && "$ghoten_count" -ne 2 ]]; then
            echo "::error::A Ghoten-triggered rebuild requires both Ghoten DEB packages."
            exit 1
          fi

          find site/pool -type f -maxdepth 5 -print | sort

      - name: Generate APT index
        run: |
          cd site

          # Generate one combined index for every package in the shared repository.
          apt-ftparchive packages pool/ > /tmp/Packages.all
          echo "==> Packages:"
          cat /tmp/Packages.all

          # Split into per-arch directories
          for APT_ARCH in amd64 arm64 armhf i386; do
            mkdir -p "dists/stable/main/binary-${APT_ARCH}"
            awk -v arch="${APT_ARCH}" \
              'BEGIN{RS="";ORS="\n\n"} $0 ~ "Architecture: "arch"(\n|$)"' \
              /tmp/Packages.all \
              | sed 's/[[:space:]]*$//' > "dists/stable/main/binary-${APT_ARCH}/Packages"
            gzip -k "dists/stable/main/binary-${APT_ARCH}/Packages"
          done

          # Generate Release file
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=vmvarela \
            -o APT::FTPArchive::Release::Label=vmvarela \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64 armhf i386" \
            -o APT::FTPArchive::Release::Components=main \
            -o "APT::FTPArchive::Release::Description=vmvarela APT repository" \
            release dists/stable > dists/stable/Release
          echo "==> Release:"
          cat dists/stable/Release

      - name: Sign Release
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -z "${GPG_SIGNING_KEY}" ]; then
            echo "::warning::GPG_SIGNING_KEY not set — repository will be unsigned"
            exit 0
          fi
          echo "${GPG_SIGNING_KEY}" | gpg --batch --import
          gpg --armor --export "${GPG_KEY_ID}" > site/key.gpg
          gpg --batch --yes --pinentry-mode loopback \
            --default-key "${GPG_KEY_ID}" \
            --detach-sign --armor \
            -o site/dists/stable/Release.gpg site/dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback \
            --default-key "${GPG_KEY_ID}" \
            --clearsign \
            -o site/dists/stable/InRelease site/dists/stable/Release

      - name: Create index page
        run: |
          cat > site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>vmvarela APT repository</title></head>
          <body>
          <h1>vmvarela APT repository</h1>
          <h2>Installation</h2>
          <pre>
          curl -sSL https://vmvarela.github.io/apt-packages/key.gpg \
            | sudo tee /etc/apt/keyrings/vmvarela.asc
          echo "deb [signed-by=/etc/apt/keyrings/vmvarela.asc] https://vmvarela.github.io/apt-packages stable main" \
            | sudo tee /etc/apt/sources.list.d/vmvarela.list
          sudo apt update
          sudo apt install sql-pipe
          sudo apt install ghoten
          </pre>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
